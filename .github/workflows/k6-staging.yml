name: k6 Staging Load Test

# Manual trigger only — never run automatically against staging/production.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "Scenario to run"
        required: true
        default: browse
        type: choice
        options:
          - browse
          - auth
          - websocket
          - order-flow
          - stage1-http
          - stage1-ws
          - stage1-mixed
      base_url:
        description: "Backend base URL (e.g. https://staging.example.com)"
        required: true
        type: string
      ws_url:
        description: "WebSocket URL (e.g. wss://staging.example.com/ws)"
        required: false
        type: string
      # Tunable parameters — Stage 1 scenarios read these via __ENV
      target_rps:
        description: "Peak RPS for stage1-http (default: 1500)"
        required: false
        default: "1500"
        type: string
      target_vu:
        description: "Peak VUs / WS connections for stage1-ws and stage1-mixed (default: 5000)"
        required: false
        default: "5000"
        type: string
      ramp_duration:
        description: "Ramp-up duration, e.g. 3m (default: 3m)"
        required: false
        default: "3m"
        type: string
      hold_duration:
        description: "Sustained load duration, e.g. 10m (default: 10m)"
        required: false
        default: "10m"
        type: string

permissions:
  contents: read

# Load tests must not overlap against staging. Queue a second manual run instead of
# cancelling an operator-requested run that is already in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  k6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install k6
        run: |
          archive="$RUNNER_TEMP/k6-v0.54.0-linux-amd64.tar.gz"
          install_dir="$RUNNER_TEMP/k6-v0.54.0"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location \
            https://github.com/grafana/k6/releases/download/v0.54.0/k6-v0.54.0-linux-amd64.tar.gz \
            --output "$archive"
          echo "c7f03434854f837b6790ee81572e4b0f955241974c79a43cbb9f8d0fef069589  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" --strip-components=1 \
            k6-v0.54.0-linux-amd64/k6
          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/k6" version

      - name: Run ${{ inputs.scenario }} scenario
        env:
          BASE_URL: ${{ inputs.base_url }}
          WS_URL: ${{ inputs.ws_url }}
          TARGET_RPS: ${{ inputs.target_rps }}
          TARGET_VU: ${{ inputs.target_vu }}
          RAMP_DURATION: ${{ inputs.ramp_duration }}
          HOLD_DURATION: ${{ inputs.hold_duration }}
          # Secrets for authenticated scenarios — set in GitHub repo secrets
          TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
          TEST_BUYER_EMAIL: ${{ secrets.STAGING_BUYER_EMAIL }}
          TEST_BUYER_PASSWORD: ${{ secrets.STAGING_BUYER_PASSWORD }}
          TEST_PRODUCT_ID: ${{ secrets.STAGING_TEST_PRODUCT_ID }}
        run: |
          if [[ -z "$WS_URL" ]]; then
            base_without_trailing_slash="${BASE_URL%/}"
            case "$base_without_trailing_slash" in
              https://*) WS_URL="wss://${base_without_trailing_slash#https://}/ws" ;;
              http://*) WS_URL="ws://${base_without_trailing_slash#http://}/ws" ;;
              *)
                echo "base_url must start with http:// or https://" >&2
                exit 2
                ;;
            esac
          fi
          k6 run \
            -e BASE_URL="$BASE_URL" \
            -e WS_URL="$WS_URL" \
            -e TARGET_RPS="$TARGET_RPS" \
            -e TARGET_VU="$TARGET_VU" \
            -e RAMP_DURATION="$RAMP_DURATION" \
            -e HOLD_DURATION="$HOLD_DURATION" \
            -e TEST_EMAIL="$TEST_EMAIL" \
            -e TEST_PASSWORD="$TEST_PASSWORD" \
            -e TEST_BUYER_EMAIL="$TEST_BUYER_EMAIL" \
            -e TEST_BUYER_PASSWORD="$TEST_BUYER_PASSWORD" \
            -e TEST_PRODUCT_ID="$TEST_PRODUCT_ID" \
            load-tests/scenarios/${{ inputs.scenario }}.js
