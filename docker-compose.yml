name: skrynia2

x-backend-image: &backend-image
  image: skrynia-backend:${SKRYNIA_IMAGE_TAG:-local}
  build:
    context: ./backend
    target: runtime

x-backend-environment: &backend-environment
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-marketplace}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-marketplace}
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env to a long random production secret}
  TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:?TWO_FACTOR_ENCRYPTION_KEY must be set in .env}
  TWO_FACTOR_ENCRYPTION_KEY_VERSION: ${TWO_FACTOR_ENCRYPTION_KEY_VERSION:-1}
  ACCESS_TOKEN_TTL_MIN: ${ACCESS_TOKEN_TTL_MIN:-15}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-90}
  SESSION_REMEMBER_ME_DAYS: ${SESSION_REMEMBER_ME_DAYS:-90}
  REFRESH_ROTATION_ENABLED: ${REFRESH_ROTATION_ENABLED:-true}
  COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
  ADDITIONAL_ALLOWED_ORIGINS: ${ADDITIONAL_ALLOWED_ORIGINS:-}
  PUBLIC_BACKEND_URL: ${PUBLIC_BACKEND_URL:-http://localhost:4000}
  PLATFORM_FEE_BPS: ${PLATFORM_FEE_BPS:-1000}
  AUTO_RELEASE_HOURS: ${AUTO_RELEASE_HOURS:-72}
  PG_POOL_MAX: ${PG_POOL_MAX:-10}
  PG_CONNECTION_TIMEOUT_MS: ${PG_CONNECTION_TIMEOUT_MS:-3000}
  HEALTHCHECK_TIMEOUT_MS: ${HEALTHCHECK_TIMEOUT_MS:-1000}
  SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-20000}
  SHUTDOWN_HARD_TIMEOUT_MS: ${SHUTDOWN_HARD_TIMEOUT_MS:-30000}
  RUNTIME_HEARTBEAT_INTERVAL_MS: ${RUNTIME_HEARTBEAT_INTERVAL_MS:-10000}
  RUNTIME_HEARTBEAT_TTL_MS: ${RUNTIME_HEARTBEAT_TTL_MS:-30000}
  STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
  LOCAL_UPLOAD_DIR: uploads
  MEDIA_PUBLIC_BASE_URL: ${MEDIA_PUBLIC_BASE_URL:-}
  STORAGE_TEMP_TTL_HOURS: ${STORAGE_TEMP_TTL_HOURS:-24}
  STORAGE_MAX_IMAGE_WIDTH: ${STORAGE_MAX_IMAGE_WIDTH:-8192}
  STORAGE_MAX_IMAGE_HEIGHT: ${STORAGE_MAX_IMAGE_HEIGHT:-8192}
  STORAGE_MAX_IMAGE_PIXELS: ${STORAGE_MAX_IMAGE_PIXELS:-40000000}
  STORAGE_DAILY_UPLOAD_BYTES_PER_USER: ${STORAGE_DAILY_UPLOAD_BYTES_PER_USER:-104857600}
  STORAGE_TOTAL_QUOTA_BYTES_PER_USER: ${STORAGE_TOTAL_QUOTA_BYTES_PER_USER:-524288000}
  STORAGE_MAX_OBJECTS_PER_PURPOSE: ${STORAGE_MAX_OBJECTS_PER_PURPOSE:-500}
  STORAGE_MAX_CONCURRENT_PROCESSING: ${STORAGE_MAX_CONCURRENT_PROCESSING:-4}
  STORAGE_PROCESSING_QUEUE_LIMIT: ${STORAGE_PROCESSING_QUEUE_LIMIT:-16}
  UPLOAD_RATE_LIMIT_PER_MIN: ${UPLOAD_RATE_LIMIT_PER_MIN:-20}
  UPLOAD_RATE_LIMIT_PER_IP: ${UPLOAD_RATE_LIMIT_PER_IP:-60}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  PUBLIC_READ_RATE_LIMIT_PER_MIN: ${PUBLIC_READ_RATE_LIMIT_PER_MIN:-600}
  ANONYMOUS_WRITE_RATE_LIMIT_PER_MIN: ${ANONYMOUS_WRITE_RATE_LIMIT_PER_MIN:-60}
  CREDENTIAL_RATE_LIMIT_PER_15MIN: ${CREDENTIAL_RATE_LIMIT_PER_15MIN:-20}
  CREDENTIAL_RATE_LIMIT_PER_IDENTITY_15MIN: ${CREDENTIAL_RATE_LIMIT_PER_IDENTITY_15MIN:-20}
  AUTHENTICATED_WRITE_RATE_LIMIT_PER_MIN: ${AUTHENTICATED_WRITE_RATE_LIMIT_PER_MIN:-60}
  AUTHENTICATED_WRITE_RATE_LIMIT_PER_IP: ${AUTHENTICATED_WRITE_RATE_LIMIT_PER_IP:-300}
  WS_TICKET_RATE_LIMIT_PER_MIN: ${WS_TICKET_RATE_LIMIT_PER_MIN:-30}
  WS_TICKET_RATE_LIMIT_PER_IP: ${WS_TICKET_RATE_LIMIT_PER_IP:-120}
  WS_MAX_BUFFERED_BYTES: ${WS_MAX_BUFFERED_BYTES:-1048576}
  WS_MAX_ROOMS_PER_CONNECTION: ${WS_MAX_ROOMS_PER_CONNECTION:-50}
  WS_MAX_FRAMES_PER_MIN: ${WS_MAX_FRAMES_PER_MIN:-120}
  WS_MAX_JOINS_PER_MIN: ${WS_MAX_JOINS_PER_MIN:-30}
  WS_MAX_CONCURRENT_HANDLERS: ${WS_MAX_CONCURRENT_HANDLERS:-8}
  REALTIME_CHANNEL: ${REALTIME_CHANNEL:-skrynia:realtime:v1}
  PRESENCE_TTL_MS: ${PRESENCE_TTL_MS:-90000}
  PRESENCE_HEARTBEAT_MS: ${PRESENCE_HEARTBEAT_MS:-30000}
  PHONE_OTP_RATE_LIMIT_PER_15MIN: ${PHONE_OTP_RATE_LIMIT_PER_15MIN:-10}
  PHONE_OTP_RATE_LIMIT_PER_IP_15MIN: ${PHONE_OTP_RATE_LIMIT_PER_IP_15MIN:-30}
  EMAIL_VERIFICATION_RATE_LIMIT_PER_15MIN: ${EMAIL_VERIFICATION_RATE_LIMIT_PER_15MIN:-10}
  EMAIL_VERIFICATION_RATE_LIMIT_PER_IP_15MIN: ${EMAIL_VERIFICATION_RATE_LIMIT_PER_IP_15MIN:-30}
  PASSWORD_RESET_RATE_LIMIT_PER_15MIN: ${PASSWORD_RESET_RATE_LIMIT_PER_15MIN:-10}
  PASSWORD_RESET_RATE_LIMIT_PER_IP_15MIN: ${PASSWORD_RESET_RATE_LIMIT_PER_IP_15MIN:-30}
  WEBHOOK_RATE_LIMIT_PER_MIN: ${WEBHOOK_RATE_LIMIT_PER_MIN:-60}
  OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-1000}
  OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-25}
  OUTBOX_CONCURRENCY: ${OUTBOX_CONCURRENCY:-5}
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
  OUTBOX_BASE_BACKOFF_MS: ${OUTBOX_BASE_BACKOFF_MS:-1000}
  OUTBOX_LOCK_TIMEOUT_MS: ${OUTBOX_LOCK_TIMEOUT_MS:-300000}
  OUTBOX_DELIVERY_TIMEOUT_MS: ${OUTBOX_DELIVERY_TIMEOUT_MS:-5000}
  METRICS_USER: ${METRICS_USER:-metrics}
  METRICS_PASSWORD: ${METRICS_PASSWORD:?METRICS_PASSWORD must be set in .env}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
  S3_ENDPOINT: ${S3_ENDPOINT:-}
  S3_BUCKET: ${S3_BUCKET:-}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
  LIQPAY_PUBLIC_KEY: ${LIQPAY_PUBLIC_KEY:-}
  LIQPAY_PRIVATE_KEY: ${LIQPAY_PRIVATE_KEY:-}
  LIQPAY_SERVER_URL: ${LIQPAY_SERVER_URL:-}
  MONOBANK_TOKEN: ${MONOBANK_TOKEN:-}
  MONOBANK_WEBHOOK_URL: ${MONOBANK_WEBHOOK_URL:-}
  MANUAL_PAYMENT_CARD_NUMBER: ${MANUAL_PAYMENT_CARD_NUMBER:-}
  MANUAL_PAYMENT_RECEIVER_NAME: ${MANUAL_PAYMENT_RECEIVER_NAME:-}
  MANUAL_PAYMENT_BANK: ${MANUAL_PAYMENT_BANK:-}
  WAYFORPAY_MERCHANT_ACCOUNT: ${WAYFORPAY_MERCHANT_ACCOUNT:-}
  WAYFORPAY_MERCHANT_SECRET_KEY: ${WAYFORPAY_MERCHANT_SECRET_KEY:-}
  WAYFORPAY_SERVICE_URL: ${WAYFORPAY_SERVICE_URL:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
  ENABLE_TEST_PAYMENTS: "false"

x-backend-runtime: &backend-runtime
  <<: *backend-image
  init: true
  restart: unless-stopped
  stop_grace_period: 35s
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  migrate:
    <<: *backend-image
    init: true
    restart: "no"
    command: ["node", "dist/db/migrate-deploy.cli.js"]
    environment:
      <<: *backend-environment
      JOB_WORKER_ENABLED: "false"
      OUTBOX_WORKER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  backend:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/api.js"]
    environment:
      <<: *backend-environment
      PORT: 4000
      JOB_WORKER_ENABLED: "false"
      OUTBOX_WORKER_ENABLED: "false"
    ports:
      - "4000:4000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/live').then(r=>{if(!r.ok)throw Error()}).catch(()=>process.exitCode=1)"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

  worker:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/worker.js"]
    environment:
      <<: *backend-environment
      JOB_WORKER_ENABLED: "true"
      OUTBOX_WORKER_ENABLED: "false"
      RUNTIME_INSTANCE_ID: worker
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/runtime/heartbeat-healthcheck.js", "worker"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

  outbox:
    <<: *backend-runtime
    command: ["node", "dist/entrypoints/outbox.js"]
    environment:
      <<: *backend-environment
      JOB_WORKER_ENABLED: "false"
      OUTBOX_WORKER_ENABLED: "true"
      RUNTIME_INSTANCE_ID: outbox
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "dist/runtime/heartbeat-healthcheck.js", "outbox"]
      interval: 15s
      timeout: 3s
      start_period: 15s
      retries: 3

  frontend:
    image: skrynia-frontend:${SKRYNIA_IMAGE_TAG:-local}
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_API_URL: http://backend:4000
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:4000/ws}
        NEXT_PUBLIC_WS_COOKIE_FALLBACK: ${NEXT_PUBLIC_WS_COOKIE_FALLBACK:-false}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ENABLE_TEST_PAYMENTS: "false"
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_POSTHOG_KEY: ${NEXT_PUBLIC_POSTHOG_KEY:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      NEXT_PUBLIC_API_URL: http://backend:4000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
