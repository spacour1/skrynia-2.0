services:
  api:
    environment:
      REALTIME_INSTANCE_ID: e2e-api-primary
      RUNTIME_INSTANCE_ID: e2e-api-primary

  # Inherit the nonfinancial worker runtime image/environment so this replica
  # remains unable to execute the test-payment routes enabled on the primary.
  api-replica:
    extends:
      file: docker-compose.e2e.yml
      service: worker
    command: ["node", "dist/entrypoints/api.js"]
    environment:
      JOB_WORKER_ENABLED: "false"
      PORT: 4000
      REALTIME_INSTANCE_ID: e2e-api-replica
      RUNTIME_INSTANCE_ID: e2e-api-replica
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)throw Error()}).catch(()=>process.exitCode=1)"]
      interval: 2s
      timeout: 3s
      start_period: 5s
      retries: 30

  playwright:
    environment:
      E2E_PRIMARY_WS_URL: ws://api:4000/ws
      E2E_REPLICA_WS_URL: ws://api-replica:4000/ws
    depends_on:
      api-replica:
        condition: service_healthy
